</style></head> <body class="lemma-body" data-astro-cid-zkpy2lcs> <div class="lemma-container" data-astro-cid-zkpy2lcs> <header class="lemma-header" data-astro-cid-zkpy2lcs> <div class="header-nav" data-astro-cid-zkpy2lcs> <a href="/josephus-reader" class="back-link" data-astro-cid-zkpy2lcs>← Return to Josephus Reader Library</a> <div class="theme-dropdown-wrapper" data-astro-cid-x3pjskd3> <select class="theme-select" aria-label="Select theme" title="Change theme" data-astro-cid-x3pjskd3> <option value="light" title="Light theme" data-astro-cid-x3pjskd3>☀️</option> <option value="dark" title="Dark theme" data-astro-cid-x3pjskd3>🌙</option> <option value="sepia" title="Sepia theme" data-astro-cid-x3pjskd3>📜</option> </select> </div> <script>
  (function () {
    function initThemes() {
      var selects = document.querySelectorAll('.theme-select');
      if (!selects.length) return;

      function render() {
        var current = document.documentElement.dataset.theme || 'light';
        selects.forEach(function (s) {
          s.value = current;
        });
      }

      function applyTheme(targetTheme) {
        function apply() {
          document.documentElement.dataset.theme = targetTheme;
          try {
            localStorage.setItem('ne-theme', targetTheme);
          } catch (err) {}
          render();
        }
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (document.startViewTransition && !reduce) {
          document.startViewTransition(apply);
        } else {
          apply();
        }
      }

      render();

      selects.forEach(function (select) {
        select.addEventListener('change', function (e) {
          applyTheme(e.target.value);
        });
      });

      function cycleTheme() {
        var order = ['light', 'dark', 'sepia'];
        var current = document.documentElement.dataset.theme || 'light';
        var idx = order.indexOf(current);
        var nextTheme = order[(idx + 1) % order.length];
        applyTheme(nextTheme);
      }

      window.removeEventListener('cycle-theme', cycleTheme);
      window.addEventListener('cycle-theme', cycleTheme);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initThemes);
    } else {
      initThemes();
    }
  })();
</script> </div> <h1 id="lemma-head" class="lemma-title" data-astro-cid-zkpy2lcs>Concordance</h1> <p id="lemma-sub" class="lemma-sub" data-astro-cid-zkpy2lcs>Occurrence summary across Flavius Josephus</p> </header> <main class="lemma-content" data-astro-cid-zkpy2lcs> <div id="loading-state" class="status-card" data-astro-cid-zkpy2lcs>Loading concordance occurrences...</div> <div id="results-card" class="lemma-card" style="display: none;" data-astro-cid-zkpy2lcs> <div class="summary-box" data-astro-cid-zkpy2lcs> <span class="count-badge" id="count-badge" data-astro-cid-zkpy2lcs>0 occurrences</span> <span class="norm-label" id="norm-label" data-astro-cid-zkpy2lcs></span> </div> <div class="occurrences-section" data-astro-cid-zkpy2lcs> <h3 data-astro-cid-zkpy2lcs>Occurrences in Corpus</h3> <ul id="occurrences-list" class="occurrences-list" data-astro-cid-zkpy2lcs></ul> </div> </div> <div id="error-state" class="status-card error-card" style="display: none;" data-astro-cid-zkpy2lcs>Lemma not found in corpus.</div> </main> </div> <script>(function(){const base = "/josephus-reader";

      function getGreekBucket(text) {
        if (!text) return 'other';
        const norm = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        if (!norm) return 'other';
        const ch = norm[0].toLowerCase();
        const map = {
          'α': 'alpha', 'β': 'beta', 'γ': 'gamma', 'δ': 'delta',
          'ε': 'epsilon', 'ζ': 'zeta', 'η': 'eta', 'θ': 'theta',
          'ι': 'iota', 'κ': 'kappa', 'λ': 'lambda', 'μ': 'mu',
          'ν': 'nu', 'ξ': 'xi', 'ο': 'omicron', 'π': 'pi',
          'ρ': 'rho', 'σ': 'sigma', 'ς': 'sigma', 'τ': 'tau',
          'υ': 'upsilon', 'φ': 'phi', 'χ': 'chi', 'ψ': 'psi',
          'ω': 'omega'
        };
        return map[ch] || 'other';
      }

      async function loadLemma() {
        const params = new URLSearchParams(window.location.search);
        let wordKey = params.get('w') || params.get('slug') || '';
        
        // Fallback: extract from URL path if present
        if (!wordKey) {
          const parts = window.location.pathname.split('/').filter(Boolean);
          const last = parts[parts.length - 1];
          if (last && last !== 'lemma') {
            wordKey = decodeURIComponent(last);
          }
        }

        if (!wordKey) {
          document.getElementById('loading-state').style.display = 'none';
          document.getElementById('error-state').textContent = 'No lemma specified.';
          document.getElementById('error-state').style.display = 'block';
          return;
        }

        const bucket = getGreekBucket(wordKey);
        const url = `${base}/data/lemmata/${bucket}.json`;

        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error('Data fetch failed');
          const data = await resp.json();

          // Find key matching wordKey (exact or stripped)
          const normKey = wordKey.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/ς/g, 'σ');
          const entry = data[wordKey] || data[normKey] || Object.values(data).find(e => e.lemma === wordKey);

          document.getElementById('loading-state').style.display = 'none';

          if (!entry) {
            document.getElementById('lemma-head').textContent = wordKey;
            document.getElementById('error-state').style.display = 'block';
            return;
          }

          document.getElementById('lemma-head').textContent = entry.lemma || wordKey;
          document.title = `Lemma: ${entry.lemma || wordKey} — Josephus Concordance`;

          document.getElementById('count-badge').textContent = `${entry.count || (entry.occurrences ? entry.occurrences.length : 0)} occurrence(s)`;
          document.getElementById('norm-label').textContent = `Normalized: ${normKey}`;

          const listEl = document.getElementById('occurrences-list');
          listEl.innerHTML = '';

          const occurrences = entry.occurrences || [];
          if (occurrences.length === 0) {
            listEl.innerHTML = '<li>No occurrences recorded.</li>';
          } else {
            occurrences.forEach(occ => {
              const li = document.createElement('li');
              li.className = 'occ-item';
              
              const secRef = occ.sec ? ` § ${occ.sec}` : '';
              const targetUrl = `${base}/${occ.work}/book/${occ.book}`;
              
              li.innerHTML = `
                <a class="occ-link" href="${targetUrl}">
                  <span class="occ-work">${occ.work} Book ${occ.book}${secRef}</span>
                  <span class="occ-form">${occ.word}</span>
                </a>
              `;
              listEl.appendChild(li);
            });
          }

          document.getElementById('results-card').style.display = 'block';
        } catch (err) {
          console.error(err);
          document.getElementById('loading-state').style.display = 'none';
          document.getElementById('error-state').style.display = 'block';
        }
      }

      window.addEventListener('DOMContentLoaded', loadLemma);
    })();</script> </body> </html>
